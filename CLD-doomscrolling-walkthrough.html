<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doomscrolling CLD, loop by loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F1ED; --panel:#FAFAF7; --ink:#1B1E23; --muted:#5A6068; --rule:#D5D5CE; --dot:#CFCFC6;
  --r:#BF351D; --b:#2A4FBF; --r-soft:#F5E0DA; --b-soft:#E0E6F7;
  --node:#FFFFFF; --node-line:#2A2E35; --plat:#E7E1D4; --plat-line:#A69C89; --edge:#3B4048;
  --sans:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171B; --panel:#1C1F24; --ink:#E8E9EB; --muted:#A2A7AF; --rule:#31353C; --dot:#2C3037;
    --r:#EF7A62; --b:#8AA5F6; --r-soft:#3A231E; --b-soft:#1F2843;
    --node:#23272D; --node-line:#C8CBD0; --plat:#302B24; --plat-line:#7A705F; --edge:#B9BEC6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15171B; --panel:#1C1F24; --ink:#E8E9EB; --muted:#A2A7AF; --rule:#31353C; --dot:#2C3037;
  --r:#EF7A62; --b:#8AA5F6; --r-soft:#3A231E; --b-soft:#1F2843;
  --node:#23272D; --node-line:#C8CBD0; --plat:#302B24; --plat-line:#7A705F; --edge:#B9BEC6;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px;border-radius:6px}

.wrap{max-width:1200px;margin:0 auto;padding:0 28px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 16px}
.top .title{font-weight:600;font-size:17px;letter-spacing:-.005em}
.top .title span{color:var(--muted);font-weight:400}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:9px 15px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
.btn svg{width:16px;height:16px}

/* index */
.index{display:flex;gap:22px;overflow-x:auto;padding:2px 2px 16px;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.group{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.group-label{font-size:12.5px;color:var(--muted);white-space:nowrap;min-height:16px}
.chips{display:flex;gap:6px}
.chip{height:34px;min-width:42px;padding:0 11px;border:1px solid var(--rule);background:var(--panel);border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.R{color:var(--r)} .chip.B{color:var(--b)}
.chip:hover{border-color:currentColor}
.chip[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.R[aria-current="step"]{background:var(--r);border-color:var(--r);color:var(--paper)}
.chip.B[aria-current="step"]{background:var(--b);border-color:var(--b);color:var(--paper)}

/* stage */
.stage{padding:24px 0 36px}
.board{max-width:760px;margin:0 auto;border:1px solid var(--rule);border-radius:14px;padding:14px;
  background-color:var(--panel);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px}
.board svg.dia{display:block;width:100%;height:auto;max-height:calc(100vh - 330px);min-height:260px}
.cap-head{display:flex;align-items:center;gap:10px;padding:4px 4px 6px}
.cap-head h2{font-size:24px;margin:0;letter-spacing:-.01em}
.board .moments{max-width:640px;margin:0 auto}
.board .under{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px 0;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:none;padding:4px 0;font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.linkbtn:hover{text-decoration-color:currentColor}
.legend-mini{display:flex;gap:14px;flex-wrap:wrap}
.legend-mini i{font-style:normal;font-weight:700}
.legend-mini .p{color:var(--r)} .legend-mini .m{color:var(--b)}

.cldcard{background:#fff;border-radius:8px;overflow:hidden;cursor:zoom-in;border:1px solid var(--rule);padding:0}
.cldcard img{display:block;width:100%;height:auto}

/* text column */
.text{max-width:640px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;font-weight:700;font-size:15px;padding:4px 11px;border-radius:999px}
.badge.R{background:var(--r-soft);color:var(--r)} .badge.B{background:var(--b-soft);color:var(--b)} .badge.N{background:var(--rule);color:var(--ink)}
.meta .type{font-weight:600;color:var(--ink)}
h2{font-weight:600;font-size:44px;line-height:1.04;letter-spacing:-.022em;margin:14px 0 12px}
h2:focus{outline:none}
.line{font-family:var(--serif);font-size:22px;line-height:1.42;margin:0 0 24px;max-width:40ch}
h3{font-size:15.5px;font-weight:600;margin:0 0 8px;letter-spacing:-.003em}
.body p,.notice p,.plain p{font-family:var(--serif);font-size:18px;line-height:1.66;margin:0 0 14px;max-width:62ch}

.trace{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 0 16px;margin:0 0 24px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:7px 6px;margin:4px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:5px 10px;border-radius:7px;background:var(--node);border:1px solid var(--rule);white-space:nowrap}
.pill.plat{background:var(--plat);border-color:var(--plat-line)}
.pill.core{font-weight:700;border-color:var(--node-line)}
.pill .dir{font-weight:700;font-size:15px}
.pill .back{color:var(--muted);font-weight:400}
.lk{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:15px;padding:0 2px}
.lk.p{color:var(--r)} .lk.m{color:var(--b)}
.lk .dl{color:var(--muted);font-weight:400;font-size:14px}
.lk::after{content:"";display:inline-block;width:10px;height:8px;margin-left:3px;background:var(--muted);clip-path:polygon(0 0,100% 50%,0 100%)}
.result{margin:12px 0 0;font-size:15px;line-height:1.5}
.result b{font-weight:600}
.result .R{color:var(--r)} .result .B{color:var(--b)}

.notice{border-left:3px solid var(--rule);padding:2px 0 2px 16px;margin:20px 0 0}
.notice p{margin:0 !important}
.notice.R{border-color:var(--r)} .notice.B{border-color:var(--b)} .notice.N{border-color:var(--ink)}
.notice p{font-size:17px}

.weak{margin:22px 0 0;display:grid;gap:14px}
.weak div{display:grid;grid-template-columns:120px 1fr;gap:14px;padding-top:12px;border-top:1px solid var(--rule)}
.weak b{font-weight:600;font-size:15.5px}
.weak p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.58}

/* intro */
.howto{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin:8px 0 18px}
.howto div{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.45}
.howto svg{width:58px;height:24px;margin-top:1px}
.rulebox{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin:4px 0 0}
.rulebox p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.6}

/* archetype roles */
.roles{margin:6px 0 20px;display:grid;gap:0}
.roles div{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--rule);font-size:15.5px;line-height:1.45}
.roles div:last-child{border-bottom:1px solid var(--rule)}
.roles b{font-weight:600}

/* takeaway moments */
.moments{position:relative;display:grid;gap:12px;padding:4px}
.moment{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:13px 15px 12px 15px}
.moment.target{border:2px solid var(--ink)}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.m-name{font-weight:600;font-size:17px}
.m-tag{font-size:12.5px;font-weight:600;background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:999px;white-space:nowrap}
.m-codes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.moment p{margin:0;font-size:14.5px;line-height:1.45;color:var(--muted)}
.implies{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:0}
.implies li{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--rule);font-size:15.5px;line-height:1.45}
.implies li:last-child{border-bottom:1px solid var(--rule)}
.implies b{font-weight:600}
.implies .codes{color:var(--muted);font-weight:500}

/* pager */
.pager{position:sticky;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.pager .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:11px;padding-bottom:11px}
.pager .count{font-size:14px;color:var(--muted);text-align:center}
.pager .count b{color:var(--ink);font-weight:600}
.kbd{display:inline-block;margin-left:8px}

/* diagram svg */
svg.dia .nd rect{fill:var(--node);stroke:var(--node-line);stroke-width:1.2}
svg.dia .nd.plat rect{fill:var(--plat);stroke:var(--plat-line)}
svg.dia .nd.core rect{stroke-width:2.2}
svg.dia .nd text{fill:var(--ink);font-family:var(--sans);font-size:13px;font-weight:500}
svg.dia .nd.core text{font-size:15px;font-weight:700}
svg.dia .edge path.ln{fill:none;stroke:var(--edge);stroke-width:1.7}
svg.dia .edge .dly{stroke:var(--edge);stroke-width:1.8}
svg.dia .edge .sg{font-family:var(--sans);font-weight:700;font-size:17px;text-anchor:middle;dominant-baseline:central}
svg.dia .sg.p{fill:var(--r)} svg.dia .sg.m{fill:var(--b)}
svg.dia .ah{fill:var(--edge)}
svg.dia .ahR{fill:var(--r)} svg.dia .ahB{fill:var(--b)}
svg.dia .bdg path{fill:none;stroke-width:2.2}
svg.dia .bdg.R path{stroke:var(--r)} svg.dia .bdg.B path{stroke:var(--b)}
svg.dia .bdg text{font-family:var(--sans);font-weight:700;font-size:14px;text-anchor:middle;dominant-baseline:central}
svg.dia .bdg.R text{fill:var(--r)} svg.dia .bdg.B text{fill:var(--b)}
svg.dia .bdg circle{fill:var(--panel)}
svg.dia .note line{stroke:var(--muted);stroke-width:1.3}
svg.dia .note text{font-family:var(--sans);font-size:12.5px;font-style:italic;fill:var(--muted);text-anchor:middle}
svg.dia .cap{font-family:var(--sans);font-size:12.5px;font-weight:600;fill:var(--muted);text-anchor:middle}
svg.dia.anim .edge{opacity:0}
svg.dia.anim .edge.on{opacity:1}
svg.dia .edge .late{transition:opacity .2s}
svg.dia.anim .edge .late{opacity:0}
svg.dia.anim .edge.done .late{opacity:1}

dialog{border:none;padding:0;border-radius:12px;max-width:min(1240px,96vw);width:96vw;background:#fff;color:#1B1E23}
dialog::backdrop{background:rgba(20,22,26,.72)}
dialog img{display:block;width:100%;height:auto}
dialog .dhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #ddd;font-weight:600;font-size:15px}
dialog .dhead button{background:#1B1E23;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer}

@media (max-width: 900px){
  .wrap{padding:0 18px}
  .stage{padding-top:18px}
  .board svg.dia{max-height:none;min-height:0}
  .cap-head h2{font-size:20px}
  h2{font-size:34px}
  .line{font-size:19.5px}
  .body p,.notice p,.plain p{font-size:17px}
  .howto{grid-template-columns:1fr}
  .weak div,.roles div,.implies li{grid-template-columns:1fr;gap:4px}
  .kbd{display:none}
  .top .title span{display:none}
  .board{margin:0 -8px;padding:10px}
  .top .title{font-size:16px}
}
@media (prefers-reduced-motion: reduce){
  svg.dia.anim .edge,svg.dia.anim .edge .late{opacity:1 !important}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="title">Doomscrolling, loop by loop <span>A walkthrough of our causal loop diagram</span></div>
    <button class="btn" id="openCld" type="button" aria-haspopup="dialog">View full diagram</button>
  </div>
  <nav class="index" id="index" aria-label="Loops"></nav>
  <main class="stage" id="stage">
    <div class="board" id="board"></div>
  </main>
</div>

<div class="pager">
  <div class="wrap">
    <button class="btn" id="prev" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Previous
    </button>
    <div class="count" id="count"></div>
    <button class="btn primary" id="next" type="button">

    </button>
  </div>
</div>

/* ---------- helpers ---------- */
var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs){ if(attrs[k]!==undefined) e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function minusChar(s){return s==="-" ? "\u2212" : "+";}

function boxSize(id){
  var n = N[id], longest = 0;
  n.t.forEach(function(l){ longest = Math.max(longest, l.length); });
  if (n.core) return {w: longest*9.2 + 30, h: 38};
  return {w: Math.max(88, longest*7.15 + 26), h: n.t.length*16 + 18};
}

function quad(p0,c,p1,t){
  var u=1-t;
  return {x:u*u*p0.x + 2*u*t*c.x + t*t*p1.x, y:u*u*p0.y + 2*u*t*c.y + t*t*p1.y};
}
function quadD(p0,c,p1,t){
  return {x:2*(1-t)*(c.x-p0.x) + 2*t*(p1.x-c.x), y:2*(1-t)*(c.y-p0.y) + 2*t*(p1.y-c.y)};
}
function inside(p, b, m){ return Math.abs(p.x-b.x) < b.w/2 + m && Math.abs(p.y-b.y) < b.h/2 + m; }
function norm(v){ var l=Math.hypot(v.x,v.y)||1; return {x:v.x/l, y:v.y/l}; }

function defs(svg){
  var d = el("defs",{},svg);
  [["ah","ah"],["ahR","ahR"],["ahB","ahB"]].forEach(function(m){
    var mk = el("marker",{id:m[0], viewBox:"0 0 10 8", refX:"9.5", refY:"4", markerWidth:"10", markerHeight:"8", markerUnits:"userSpaceOnUse", orient:"auto"}, d);
    el("path",{d:"M0,0 L10,4 L0,8 z", "class":m[1]}, mk);
  });
}

/* draws one causal link as a curved arrow, trimmed to the node boxes */
function drawEdge(svg, A, B, link, bend, opt){
  opt = opt || {};
  var mid = {x:(A.x+B.x)/2, y:(A.y+B.y)/2};
  var d = norm({x:B.x-A.x, y:B.y-A.y});
  var perp = {x:d.y, y:-d.x};
  var C = {x:mid.x + perp.x*bend, y:mid.y + perp.y*bend};
  var t0=0, t1=1;
  while (t0 < 0.5 && inside(quad(A,C,B,t0), A, 5)) t0 += 0.004;
  while (t1 > 0.5 && inside(quad(A,C,B,t1), B, 5)) t1 -= 0.004;
  var pts = [];
  for (var i=0;i<=40;i++){ var p = quad(A,C,B, t0 + (t1-t0)*i/40); pts.push(p.x.toFixed(1)+","+p.y.toFixed(1)); }
  var g = el("g",{"class":"edge"}, svg);
  var path = el("path",{"class":"ln", d:"M"+pts.join(" L")}, g);
  path.dataset.marker = "url(#ah)";
  var side = bend>=0 ? 1 : -1;
  var out = {x:perp.x*side, y:perp.y*side};
  if (link.d){
    var tm = (t0+t1)/2, pm = quad(A,C,B,tm), tg = norm(quadD(A,C,B,tm)), nv = {x:-tg.y, y:tg.x};
    [-2.8,2.8].forEach(function(o){
      var cx = pm.x + tg.x*o, cy = pm.y + tg.y*o;
      el("line",{"class":"dly", x1:(cx-nv.x*8).toFixed(1), y1:(cy-nv.y*8).toFixed(1), x2:(cx+nv.x*8).toFixed(1), y2:(cy+nv.y*8).toFixed(1)}, g);
    });
  }
  if (opt.signSide) out = {x:out.x*opt.signSide, y:out.y*opt.signSide};
  var ts = t1 - (opt.signT||0.13)*(t1-t0), ps = quad(A,C,B,ts);
  var lab = el("text",{"class":"sg late " + (link.s==="-"?"m":"p"), x:(ps.x+out.x*13).toFixed(1), y:(ps.y+out.y*13).toFixed(1)}, g);
  lab.textContent = minusChar(link.s);
  return g;
}

function drawNode(svg, id, x, y){
  var n = N[id], s = boxSize(id);
  var g = el("g",{"class":"nd" + (n.plat?" plat":"") + (n.core?" core":"")}, svg);
  el("rect",{x:(x-s.w/2).toFixed(1), y:(y-s.h/2).toFixed(1), width:s.w.toFixed(1), height:s.h, rx:7}, g);
  var lh = 16, y0 = y - (n.t.length-1)*lh/2;
  n.t.forEach(function(line,i){
    var t = el("text",{x:x.toFixed(1), y:(y0+i*lh).toFixed(1), "text-anchor":"middle", "dominant-baseline":"central"}, g);
    t.textContent = line;
  });
  return {x:x, y:y, w:s.w, h:s.h};
}

function drawBadge(svg, x, y, code, type, caption, capDy, ccw){
  var g = el("g",{"class":"bdg " + type}, svg);
  el("circle",{cx:x, cy:y, r:26}, g);
  var R = 20, a0 = (ccw ? 235 : -55)*Math.PI/180, a1 = (ccw ? -55 : 235)*Math.PI/180;
  var p0 = [x+R*Math.cos(a0), y+R*Math.sin(a0)], p1 = [x+R*Math.cos(a1), y+R*Math.sin(a1)];
  el("path",{d:"M"+p0[0].toFixed(1)+","+p0[1].toFixed(1)+" A"+R+" "+R+" 0 1 "+(ccw?0:1)+" "+p1[0].toFixed(1)+","+p1[1].toFixed(1), "marker-end":"url(#ah"+type+")"}, g);
  var t = el("text",{x:x, y:y+0.5}, g); t.textContent = code;
  if (caption){ var c = el("text",{"class":"cap", x:x, y:y+(capDy||44)}, svg); c.textContent = caption; }
}

function newSvg(label){
  var svg = el("svg",{"class":"dia", viewBox:"0 0 480 410", role:"img", "aria-label":label});
  defs(svg);
  return svg;
}

/* circular layout for a single loop */
function loopDiagram(step){
  var n = step.nodes.length, cx = 240, cy = 207;
  var r = {2:118, 3:130, 4:134, 5:142, 6:150}[n];
  var svg = newSvg(step.code + " " + step.name + " loop diagram");
  var pos = step.nodes.map(function(id,i){
    var a = (-90 + i*360/n) * Math.PI/180;
    var p = {x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)};
    var s = boxSize(id); p.w = s.w; p.h = s.h; return p;
  });
  var edgeLayer = el("g",{},svg);
  step.nodes.forEach(function(id,i){
    var A = pos[i], B = pos[(i+1)%n];
    var mid = {x:(A.x+B.x)/2 - cx, y:(A.y+B.y)/2 - cy};
    var k = n===2 ? r*1.25 : 1.75*(r - Math.hypot(mid.x, mid.y));
    drawEdge(edgeLayer, A, B, step.links[i], k);
  });
  step.nodes.forEach(function(id,i){ drawNode(svg, id, pos[i].x, pos[i].y); });
  drawBadge(svg, cx, cy, step.code, step.type);
  if (step.note){
    var tgt = pos[step.nodes.indexOf(step.note.target)];
    var nx = step.note.x, ny = step.note.y;
    var g = el("g",{"class":"note"}, svg);
    el("line",{x1:nx-4, y1:ny-20, x2:(tgt.x+tgt.w/2-18).toFixed(1), y2:(tgt.y+tgt.h/2+6).toFixed(1), "stroke-dasharray":"4 4", "marker-end":"url(#ah)"}, g);
    step.note.t.forEach(function(line,i){ var tx = el("text",{x:nx, y:ny+i*16}, g); tx.textContent = line; });
  }
  return svg;
}

/* Shifting the Burden: B2, B3 and R4 on one picture */
function archetypeDiagram(){
  var svg = newSvg("Shifting the Burden archetype built from loops B2, B3 and R4");
  var P = {scroll:{x:195,y:58}, need:{x:195,y:207}, offline:{x:195,y:356}};
  Object.keys(P).forEach(function(k){ var s=boxSize(k); P[k].w=s.w; P[k].h=s.h; });
  var layer = el("g",{},svg);
  drawEdge(layer, P.need, P.scroll, L("+"), 118);
  drawEdge(layer, P.scroll, P.need, L("-"), 118);
  drawEdge(layer, P.need, P.offline, L("+"), -118);
  drawEdge(layer, P.offline, P.need, L("-",1), -118);
  drawEdge(layer, P.scroll, P.offline, L("-",1), 330);
  drawNode(svg, "scroll", P.scroll.x, P.scroll.y);
  drawNode(svg, "need", P.need.x, P.need.y);

  drawBadge(svg, 312, 207, "R4", "R");
  var caps = [["Quick fix",66,136],["Fundamental fix",60,286],["Side effect",428,211]];
  caps.forEach(function(c){ var t = el("text",{"class":"cap", x:c[1], y:c[2]}, svg); t.textContent=c[0]; });
  return svg;

/* ---------- trace animation ---------- */
var timers = [];
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function trace(svg){
  clearTimers();
  var edges = Array.prototype.slice.call(svg.querySelectorAll(".edge"));
  if (reduceMotion){
    edges.forEach(function(g){ var p=g.querySelector("path.ln"); p.setAttribute("marker-end", p.dataset.marker); });
    return;
  }
  svg.classList.add("anim");
  edges.forEach(function(g,i){
    var p = g.querySelector("path.ln"), len = p.getTotalLength();
    g.classList.remove("on","done");
    p.removeAttribute("marker-end");
    p.style.transition = "none";
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    timers.push(setTimeout(function(){
      g.classList.add("on");
      p.getBoundingClientRect();
      p.style.transition = "stroke-dashoffset .42s ease-out";
      p.style.strokeDashoffset = 0;
    }, 220 + i*430));
    timers.push(setTimeout(function(){
      g.classList.add("done");
      p.setAttribute("marker-end", p.dataset.marker);
    }, 220 + i*430 + 430));
  });
}

/* ---------- text builders ---------- */
function chainHTML(step){
  var dir = 1, minus = 0, out = [];
  function pill(id, dir, back){
    var n = N[id];
    return '<span class="pill' + (n.plat?' plat':'') + (n.core?' core':'') + '">' +
      (back ? '<span class="back">back to</span> ' : '') + esc(n.name) +
      ' <span class="dir" aria-label="' + (dir>0?'goes up':'goes down') + '">' + (dir>0?'\u2191':'\u2193') + '</span></span>';
  }
  step.nodes.forEach(function(id,i){
    out.push(pill(id, dir, false));
    var l = step.links[i];
    var title = (l.s==="-" ? "opposite direction" : "same direction") + (l.d ? ", with a delay" : "");
    out.push('<span class="lk ' + (l.s==="-"?'m':'p') + '" title="' + title + '" aria-label="' + title + '">' + minusChar(l.s) + (l.d?'<span class="dl">\u2016</span>':'') + '</span>');
    if (l.s==="-"){ dir = -dir; minus++; }
  });
  out.push(pill(step.nodes[0], dir, true));
  var res = (dir>0 ? 'Comes back <b>up</b>, so it <b class="R">reinforces</b>.' : 'Comes back <b>down</b>, so it <b class="B">balances</b>.') +
    ' ' + (minus===0 ? 'No' : minus) + ' minus link' + (minus===1?'':'s') + '.';
  return '<div class="trace"><h3>Follow one change round the loop</h3><div class="chain">' + out.join("") + '</div><p class="result">' + res + '</p></div>';
}

function paras(arr){ return arr.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join(""); }

function loopText(step){
  var h = '<div class="meta"><span class="badge ' + step.type + '">' + step.code + '</span><span class="type">' +
    (step.type==="R" ? "Reinforcing loop" : "Balancing loop") + '</span><span>' + esc(step.acts) + '</span></div>';
  h += '<h2 tabindex="-1">' + esc(step.name) + '</h2>';
  h += '<p class="line">' + esc(step.line) + '</p>';

      step.weak.map(function(w){ return '<div><b>' + esc(w[0]) + '</b><p>' + esc(w[1]) + '</p></div>'; }).join("") + '</div>';
  }
  if (step.notice) h += '<div class="notice ' + step.type + '"><p>' + esc(step.notice) + '</p></div>';
  return h;
}

    if (kind==="p") s += '<text x="38" y="8" style="fill:var(--r);font-weight:700;font-size:14px;font-family:var(--sans)" text-anchor="middle" dominant-baseline="central">+</text>';

        var s = o.s, cls = s.type || "", txt = s.code || s.chip, title = s.name || s.chip;
        return '<button type="button" class="chip ' + cls + '" data-i="' + o.i + '" title="' + esc(title) + '">' + esc(txt) + '</button>';
      }).join("") + '</div></div>';
  });
  indexEl.innerHTML = html;
  indexEl.addEventListener("click", function(e){
    var b = e.target.closest("button[data-i]"); if (b) go(+b.dataset.i, true);
  });
}

/* ---------- render ---------- */
var boardEl = document.getElementById("board");
var cur = 0;

function capHead(s){
  if (s.code) return '<div class="cap-head"><span class="badge ' + s.type + '">' + s.code + '</span><h2 tabindex="-1">' + esc(s.name) + '</h2></div>';
  var name = s.kind==="intro" ? "Full causal loop diagram" : s.kind==="stb" ? "Shifting the Burden" : "Where the intervention acts";
  var badges = s.kind==="stb" ? '<span class="badge B">B2</span><span class="badge B">B3</span><span class="badge R">R4</span>' : '';
  return '<div class="cap-head">' + badges + '<h2 tabindex="-1">' + name + '</h2></div>';
}

function render(i){
  var s = STEPS[i];
  clearTimers();
  boardEl.innerHTML = capHead(s);
  var svg = null;
  if (s.kind==="intro"){
    boardEl.insertAdjacentHTML("beforeend", '<button type="button" class="cldcard" id="cardCld" aria-label="Open the full diagram"><img src="' + CLD_SRC + '" alt="The team\u2019s causal loop diagram of doomscrolling"></button>' +
      '<div class="under"><span class="legend-mini"><span><i class="p">+</i> same direction</span><span><i class="m">\u2212</i> opposite</span><span><i>\u2016</i> delay</span></span><button type="button" class="linkbtn" id="cardCld2">Open full size</button></div>');
  } else if (s.kind==="end"){
    boardEl.insertAdjacentHTML("beforeend", momentsBoard());
  } else {
    svg = s.kind==="loop" ? loopDiagram(s) : archetypeDiagram();
    boardEl.appendChild(svg);
    if (window.innerWidth < 640) try {
      var bb = svg.getBBox(), pad = 14;
      svg.setAttribute("viewBox", [bb.x-pad, bb.y-pad, bb.width+pad*2, bb.height+pad*2].map(function(v){return v.toFixed(1);}).join(" "));
    } catch(e){}
    var under = document.createElement("div");
    under.className = "under";
    under.innerHTML = '<span class="legend-mini"><span><i class="p">+</i> same direction</span><span><i class="m">\u2212</i> opposite</span><span><i>\u2016</i> delay</span></span><button type="button" class="linkbtn" id="replay">Trace the loop again</button>';
    boardEl.appendChild(under);
    trace(svg);
  }

  Array.prototype.forEach.call(indexEl.querySelectorAll(".chip"), function(c){
    if (+c.dataset.i === i) c.setAttribute("aria-current","step"); else c.removeAttribute("aria-current");
  });
  var active = indexEl.querySelector('[aria-current="step"]');
  if (active && active.scrollIntoView) active.scrollIntoView({block:"nearest", inline:"nearest"});

  document.getElementById("prev").disabled = i===0;
  var nx = document.getElementById("next");
  nx.disabled = i===STEPS.length-1;
  var label = s.code ? s.code + " " + s.name : (s.kind==="stb" ? "Shifting the Burden" : s.chip);
  document.getElementById("count").innerHTML = '<b>' + esc(label) + '</b><br>Step ' + (i+1) + ' of ' + STEPS.length;

  var rp = document.getElementById("replay");
  if (rp && svg) rp.addEventListener("click", function(){ trace(svg); });
  ["cardCld","cardCld2"].forEach(function(id){ var b=document.getElementById(id); if(b) b.addEventListener("click", openCld); });
  Array.prototype.forEach.call(boardEl.querySelectorAll("[data-go]"), function(b){
    b.addEventListener("click", function(){ go(+b.dataset.go, true); });
  });
}

function go(i, fromUser){
  if (i<0 || i>=STEPS.length) return;
  cur = i;
  render(i);
  try { history.replaceState(null, "", "#" + STEPS[i].id); } catch(e){}
  if (fromUser){
    var top = document.getElementById("stage").getBoundingClientRect().top;
    if (top < 0) window.scrollTo({top: window.scrollY + top - 8, behavior: reduceMotion ? "auto" : "smooth"});
    var h2 = boardEl.querySelector("h2"); if (h2) h2.focus({preventScroll:true});
  }
}

/* ---------- dialog ---------- */
var dlg = document.getElementById("cld");
function openCld(){ if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open",""); }
document.getElementById("openCld").addEventListener("click", openCld);
document.getElementById("closeCld").addEventListener("click", function(){ dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
dlg.addEventListener("click", function(e){ if (e.target===dlg) dlg.close(); });

document.getElementById("prev").addEventListener("click", function(){ go(cur-1, true); });
document.getElementById("next").addEventListener("click", function(){ go(cur+1, true); });
document.addEventListener("keydown", function(e){
  if (dlg.open) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key==="ArrowRight"){ go(cur+1, true); }
  else if (e.key==="ArrowLeft"){ go(cur-1, true); }
});

window.addEventListener("hashchange", function(){
  var id = (location.hash||"").replace("#","");
  if (byId[id]!==undefined && byId[id]!==cur) go(byId[id], false);
});
buildIndex();
var h = (location.hash||"").replace("#","");
go(byId[h]!==undefined ? byId[h] : 0, false);
})();
</script>
</body>
</html>
